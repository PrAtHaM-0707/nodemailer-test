<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Send Welcome Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input[type="email"] {
      padding: 10px;
      width: 200px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    #message {
      margin-top: 10px;
      color: green;
      display: none;
    }
    #error {
      margin-top: 10px;
      color: red;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enter Your Gmail</h2>
    <form id="emailForm">
      <input type="email" id="email" name="email" placeholder="Enter your Gmail address" required>
      <br>
      <button type="submit">Send Welcome Email</button>
    </form>
    <p id="message">Welcome email sent successfully!</p>
    <p id="error"></p>
  </div>

  <script>
    const form = document.getElementById('emailForm');
    const message = document.getElementById('message');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      try {
        const response = await fetch('https://nodemailer-test-409a.onrender.com/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (response.ok) {
          message.style.display = 'block';
          error.style.display = 'none';
        } else {
          error.textContent = result.error || 'Failed to send email.';
          error.style.display = 'block';
          message.style.display = 'none';
        }
      } catch (err) {
        error.textContent = 'Error: Unable to connect to the server.';
        error.style.display = 'block';
        message.style.display = 'none';
      }
    });
  </script>
</body>
</html>
